# Render Blueprint — UNDIMENSION Backend
# https://render.com/docs/blueprint-spec
#
# Setup:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Select this repo → render.yaml will be auto-detected
#   4. Set these env vars manually in Render dashboard:
#      - NEXT_PUBLIC_SUPABASE_URL (from Supabase → Settings → API → Project URL)
#      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (sb_publishable_xxx)
#      - SUPABASE_SERVICE_KEY (service_role key — SECRET, server-only)
#   5. DATABASE_URL is auto-set by Render PostgreSQL
#   6. Deploy!

databases:
  - name: undimension-db
    databaseName: undimension
    user: undimension
    plan: free

services:
  - type: web
    name: undimension-api
    runtime: node
    plan: free
    buildCommand: bun install && bun run db:generate && bun run db:push
    startCommand: bun run start
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: undimension-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
    autoDeploy: true
    branch: main
