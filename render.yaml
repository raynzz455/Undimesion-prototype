# Render Blueprint — UNDIMENSION Backend
# https://render.com/docs/blueprint-spec
#
# This file configures the backend deployment on Render.
# It creates a PostgreSQL database + a web service (Node.js API).
#
# Prerequisites:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Select this repo → render.yaml will be auto-detected
#   4. Set environment variables in Render dashboard:
#      - SUPABASE_URL (for image storage)
#      - SUPABASE_SERVICE_KEY (for image storage)
#   5. Deploy!

databases:
  - name: undimension-db
    databaseName: undimension
    user: undimension
    plan: free
    # Render will automatically set DATABASE_URL to:
    # postgresql://undimension:PASSWORD@HOST:5432/undimension

services:
  - type: web
    name: undimension-api
    runtime: node
    plan: free
    buildCommand: bun install && bun run db:generate && bun run db:push
    startCommand: bun run start
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: undimension-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Set manually in Render dashboard
    # Auto-deploy from main branch
    autoDeploy: true
    branch: main
