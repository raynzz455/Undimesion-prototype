# ─────────────────────────────────────────────────────────────────────────────
# Database Setup — Push Prisma schema + seed Supabase PostgreSQL
# Triggers when prisma/schema.prisma changes or manually
#
# Setup:
#   1. Set DATABASE_URL secret in GitHub
#      (Same Supabase connection string as in your .env.local)
#   2. This workflow pushes the schema + seeds initial data to Supabase
# ═══════════════────────────────────────────────────────────────────────────

name: Database Setup

on:
  push:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "scripts/seed*.ts"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Push schema to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠ DATABASE_URL secret not set. Skipping."
            echo "Set it in GitHub repo Settings → Secrets and variables → Actions"
            echo "Value = your Supabase PostgreSQL connection string"
            exit 0
          fi
          echo "Pushing Prisma schema to Supabase PostgreSQL..."
          bun run db:push
          echo "✅ Schema pushed"

      - name: Seed database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Skipping seed (no DATABASE_URL)"
            exit 0
          fi
          echo "Seeding database..."
          bun run scripts/seed.ts || true
          bun run scripts/seed-news.ts || true
          echo "✅ Seed complete"
