# ─────────────────────────────────────────────────────────────────────────────
# Deploy to Vercel — Auto-deploy frontend on push to main
# Requires VERCEL_TOKEN and VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets
#
# Setup:
#   1. npm i -g vercel
#   2. vercel link (in repo root) → creates .vercel/ directory
#   3. Get tokens from: https://vercel.com/account/tokens
#   4. Add secrets to GitHub repo:
#      - VERCEL_TOKEN
#      - VERCEL_ORG_ID (from .vercel/project.json)
#      - VERCEL_PROJECT_ID (from .vercel/project.json)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          # Use a dummy SQLite URL for build (no DB needed at build time)
          DATABASE_URL: "file:./db/build.db"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
