# ─────────────────────────────────────────────────────────────────────────────
# Deploy to Cloudflare Pages — STATIC frontend only
#
# ⚠️ NOTE: Cloudflare Pages does NOT support Next.js 16 API routes.
#   - @cloudflare/next-on-pages only supports Next.js ≤15.5.2
#   - Next.js 16 requires Node.js runtime (not Edge runtime)
#
# This workflow deploys ONLY the static frontend (HTML/CSS/JS).
# API routes will NOT work on Cloudflare Pages with Next.js 16.
#
# For FULL functionality (frontend + API routes), use VERCEL instead:
#   - Vercel natively supports Next.js 16
#   - API routes run as serverless functions
#   - No adapter needed
#
# If you still want Cloudflare Pages (static only), this workflow:
#   1. Builds Next.js with static export (output: 'export')
#   2. Deploys the 'out' folder to Cloudflare Pages
#
# To enable static export, you need to:
#   1. Set next.config: output: 'export'
#   2. Remove API routes from build (they won't work on static hosting)
#   3. Use external API (e.g. Supabase REST API directly from client)
#
# RECOMMENDATION: Use Vercel for production. This workflow is kept
# for reference but is DISABLED by default.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Cloudflare Pages (Static Only)

on:
  workflow_dispatch: # Manual trigger only — disabled for push

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: false # Disabled — uncomment to enable manual trigger
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=undimension
