# ─────────────────────────────────────────────────────────────────────────────
# Deploy to Render — Auto-deploy backend + database on push to main
# Requires RENDER_DEPLOY_HOOK_URL secret
#
# Setup:
#   1. Go to render.com → New → Blueprint
#   2. Select this repo → render.yaml will be auto-detected
#   3. Create a Deploy Hook on the web service:
#      Settings → Deploy Hook → Create
#   4. Add the hook URL as GitHub secret: RENDER_DEPLOY_HOOK_URL
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - "src/app/api/**"
      - "prisma/**"
      - "package.json"
      - "render.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠ RENDER_DEPLOY_HOOK_URL not set. Skipping."
            echo "Set it in GitHub repo Settings → Secrets → Actions"
            exit 0
          fi
          echo "Triggering Render deploy hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Render deploy triggered (HTTP $HTTP_CODE)"
          else
            echo "❌ Render deploy failed (HTTP $HTTP_CODE)"
            exit 1
          fi
