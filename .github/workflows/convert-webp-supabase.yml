# Convert uploaded images to WebP and sync to Supabase bucket
# Triggers: when images are pushed to /public/gallery/uploads/
# or manually via workflow_dispatch
#
# Setup:
#   1. Create a Supabase project at https://supabase.com
#   2. Create a bucket named "gallery" (public)
#   3. Add these repository secrets (Settings → Secrets → Actions):
#      - SUPABASE_URL: https://xxxxx.supabase.co
#      - SUPABASE_SERVICE_KEY: your service_role key (not anon)
#   4. Push images to /public/gallery/uploads/ — this workflow converts
#      them to WebP and uploads to Supabase

name: Convert Images to WebP + Sync Supabase

on:
  push:
    paths:
      - "public/gallery/uploads/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Force reconvert all images"
        required: false
        default: "false"

jobs:
  convert-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install sharp
        run: bun add sharp

      - name: Convert images to WebP
        id: convert
        run: |
          mkdir -p /tmp/webp-output
          CONVERTED=0

          # Get changed files (or all if force)
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FILES=$(find public/gallery/uploads -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) 2>/dev/null)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- "public/gallery/uploads/" 2>/dev/null || echo "")
          fi

          if [ -z "$FILES" ]; then
            echo "No new images to convert."
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          for FILE in $FILES; do
            if [ ! -f "$FILE" ]; then continue; fi

            BASENAME=$(basename "$FILE" | sed 's/\.[^.]*$//')
            OUTPUT="/tmp/webp-output/${BASENAME}.webp"

            # Convert to WebP (resize max 1280px, quality 78)
            npx sharp-cli -i "$FILE" -o "$OUTPUT" resize 1280 webp --quality 78 2>/dev/null || \
            node -e "
              const sharp = require('sharp');
              const fs = require('fs');
              sharp('$FILE')
                .resize({ width: 1280, withoutEnlargement: true })
                .webp({ quality: 78 })
                .toFile('$OUTPUT')
                .then(() => console.log('Converted: $OUTPUT'))
                .catch(e => { console.error(e); process.exit(1); });
            "

            if [ -f "$OUTPUT" ]; then
              ORIG_SIZE=$(wc -c < "$FILE" | tr -d ' ')
              WEBP_SIZE=$(wc -c < "$OUTPUT" | tr -d ' ')
              SAVINGS=$((100 - (WEBP_SIZE * 100 / ORIG_SIZE)))
              echo "✓ $FILE → ${BASENAME}.webp (${ORIG_SIZE}B → ${WEBP_SIZE}B, ${SAVINGS}% smaller)"
              CONVERTED=$((CONVERTED + 1))
            fi
          done

          echo "count=$CONVERTED" >> $GITHUB_OUTPUT
          echo "Converted $CONVERTED images."

      - name: Upload to Supabase
        if: steps.convert.outputs.count != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUCKET_NAME: gallery
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "⚠ Supabase credentials not set. Skipping upload."
            echo "Add SUPABASE_URL and SUPABASE_SERVICE_KEY to repository secrets."
            exit 0
          fi

          for FILE in /tmp/webp-output/*.webp; do
            if [ ! -f "$FILE" ]; then continue; fi
            BASENAME=$(basename "$FILE")

            # Upload to Supabase Storage
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              "${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${BASENAME}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: image/webp" \
              --data-binary @"$FILE")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "✓ Uploaded: ${BASENAME} → Supabase (${HTTP_CODE})"
            else
              echo "✗ Failed: ${BASENAME} (HTTP ${HTTP_CODE})"
            fi
          done

      - name: Summary
        run: |
          echo "## WebP Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Converted: ${{ steps.convert.outputs.count }} images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All images converted to WebP (max 1280px, quality 78) and synced to Supabase bucket." >> $GITHUB_STEP_SUMMARY
